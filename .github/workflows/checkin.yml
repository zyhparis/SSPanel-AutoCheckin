########################################
          # 3. 循环签到逻辑
          ########################################
          FAILED_ACCOUNTS=""
          TOTAL_COUNT=0

          LOG_FILE="failed_details.log"
          > "$LOG_FILE"

          # 使用 printf 格式化，确保多行环境变量被正确逐行按回车拆分
          printf "%s\n" "$COOKIES" | while IFS= read -r line || [ -n "$line" ]; do
              # 忽略空行
              [ -z "$line" ] && continue
              
              # 清理可能存在的回车换行符
              line=$(echo "$line" | tr -d '\r')

              # 解析账号名称与 Cookie（格式：账号名####Cookie）
              ACCOUNT_NAME=$(echo "$line" | awk -F '####' '{print $1}')
              COOKIE_VAL=$(echo "$line" | awk -F '####' '{print $2}')

              # 兼容未带 #### 标识的情况
              if [ -z "$COOKIE_VAL" ]; then
                  COOKIE_VAL="$ACCOUNT_NAME"
                  ACCOUNT_NAME="账号_$((TOTAL_COUNT+1))"
              fi

              TOTAL_COUNT=$((TOTAL_COUNT + 1))

              # 账号间拉开 3-8 秒随机间隔
              if [ $TOTAL_COUNT -gt 1 ]; then
                  INTERVAL=$(( 3 + RANDOM % 6 ))
                  echo "等待 ${INTERVAL} 秒后处理下一个账号..."
                  sleep $INTERVAL
              fi

              echo "--------------------------------------"
              echo "🚀 开始处理 ${ACCOUNT_NAME}..."
              echo "北京时间请求发送：$(date -u -d '+8 hour' '+%F %T')"

              RESPONSE=$(curl \
                --silent \
                --show-error \
                --fail-with-body \
                --max-time 30 \
                -X POST "https://ug.wj-kc.com/api/user/sign_use" \
                -H "cookie: $COOKIE_VAL" \
                -H "accept: application/json, text/plain, */*" \
                -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0" \
                -H "referer: https://3j.wj-kc.com/user" \
                2>&1)

              CURL_EXIT=$?

              if [ $CURL_EXIT -ne 0 ]; then
                  echo "❌ ${ACCOUNT_NAME} curl 请求失败（退出码：$CURL_EXIT）"
                  FAILED_ACCOUNTS="${FAILED_ACCOUNTS} ${ACCOUNT_NAME}"
                  echo "### ${ACCOUNT_NAME} 请求异常" >> "$LOG_FILE"
                  echo "curl 退出码: $CURL_EXIT" >> "$LOG_FILE"
                  echo "返回内容: $RESPONSE" >> "$LOG_FILE"
                  echo "" >> "$LOG_FILE"
                  continue
              fi

              DECODED_DATA=$(echo "$RESPONSE" | grep -oP '"data":"\K[^"]+' | base64 -d 2>/dev/null || true)
              SUCCESS=false
              CODE=""
              MSG=""

              if [ -n "$DECODED_DATA" ]; then
                  CODE=$(echo "$DECODED_DATA" | jq -r '.code // empty')
                  MSG=$(echo "$DECODED_DATA" | jq -r '.msg // empty')

                  echo "CODE : $CODE"
                  echo "MSG  : $MSG"

                  if [[ "$CODE" == "1028" && "$MSG" == "SIGN_USE_MULTY_TIMES" ]]; then
                      SUCCESS=true
                  elif [[ "$CODE" == "0" && "$MSG" == "SUCCESS" ]]; then
                      SUCCESS=true
                  fi
              fi

              if [ "$SUCCESS" = true ]; then
                  echo "✅ ${ACCOUNT_NAME} 今日签到成功 / 已签到"
              else
                  echo "❌ ${ACCOUNT_NAME} 签到失败/未知状态"
                  FAILED_ACCOUNTS="${FAILED_ACCOUNTS} ${ACCOUNT_NAME}"
                  echo "### ${ACCOUNT_NAME} 签到状态码异常" >> "$LOG_FILE"
                  echo "CODE: $CODE, MSG: $MSG" >> "$LOG_FILE"
                  echo "解码数据: $DECODED_DATA" >> "$LOG_FILE"
                  echo "原始返回: $RESPONSE" >> "$LOG_FILE"
                  echo "" >> "$LOG_FILE"
              fi

          done
