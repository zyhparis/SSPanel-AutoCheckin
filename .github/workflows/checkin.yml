name: SSPanel Auto Login & Checkin

on:
  schedule:
    # 北京时间 13:35（UTC 05:35）
    - cron: "35 5 * * *"
    # 北京时间 14:05（UTC 06:05）
    - cron: "5 6 * * *"
    # 北京时间 14:25（UTC 06:25）
    - cron: "25 6 * * *"

  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Auto Login & Checkin
        id: checkin_process
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          ########################################
          # 1. 环境检测
          ########################################
          if ! command -v jq >/dev/null 2>&1; then
              echo "❌ jq 未安装"
              exit 1
          fi

          if [ -z "$ACCOUNTS" ]; then
              echo "❌ 未检测到 ACCOUNTS 配置"
              exit 1
          fi

          EXEC_TIME=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
          echo "current_time=$EXEC_TIME" >> $GITHUB_OUTPUT
          echo "北京时间启动：$EXEC_TIME"

          ########################################
          # 2. 短随机延迟（0 - 5 分钟微调）
          ########################################
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              RANDOM_DELAY=$(( RANDOM % 301 ))
              TARGET_TIME=$(date -u -d "+8 hour +${RANDOM_DELAY} seconds" "+%F %T")
              echo "随机等待：${RANDOM_DELAY} 秒"
              echo "预计签到时间：$TARGET_TIME"
              sleep "$RANDOM_DELAY"
          fi

          ########################################
          # 3. 循环登录并签到
          ########################################
          FAILED_ACCOUNTS=""
          TOTAL_COUNT=0

          LOG_FILE="failed_details.log"
          > "$LOG_FILE"

          while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              line=$(echo "$line" | tr -d '\r')

              ACCOUNT_NAME=$(echo "$line" | awk -F '####' '{print $1}')
              EMAIL_VAL=$(echo "$line" | awk -F '####' '{print $2}')
              RAW_PASSWORD=$(echo "$line" | awk -F '####' '{print $3}')

              TOTAL_COUNT=$((TOTAL_COUNT+1))

              # 账号间间隔 1-3 分钟
              if [ $TOTAL_COUNT -gt 1 ]; then
                  INTERVAL=$(( 60 + RANDOM % 121 ))
                  echo "--------------------------------------"
                  echo "⏳ 账号处理间隔，等待 ${INTERVAL} 秒（约 $((INTERVAL/60)) 分钟）..."
                  sleep "$INTERVAL"
              fi

              echo "--------------------------------------"
              echo "🚀 开始处理 ${ACCOUNT_NAME} (${EMAIL_VAL})..."

              # 计算密码的 32位小写 MD5 值
              MD5_PASSWORD=$(echo -n "$RAW_PASSWORD" | md5sum | awk '{print $1}')

              ACCOUNT_SUCCESS=false
              LAST_ERROR=""

              ########################################
              # 阶段 A：调用登录 API 获取最新 Token
              ########################################
              echo "🔑 [1/2] 正在自动登录获取最新 Token..."

              # 构建 payload 并 Base64 编码
              LOGIN_PAYLOAD=$(jq -n --arg email "$EMAIL_VAL" --arg password "$MD5_PASSWORD" '{email: $email, password: $password}')
              ENCODED_PAYLOAD=$(echo -n "$LOGIN_PAYLOAD" | base64 -w 0)

              LOGIN_RESP_FILE=$(mktemp)
              LOGIN_HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --max-time 30 \
                -w "%{http_code}" \
                -o "$LOGIN_RESP_FILE" \
                -X POST "https://ug.wj-kc.com/api/v1/passport/auth/login" \
                -H "accept: application/json, text/plain, */*" \
                -H "content-type: application/json;charset=UTF-8" \
                -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0" \
                -H "origin: https://3j.wj-kc.com" \
                -H "referer: https://3j.wj-kc.com/login" \
                -d "{\"data\":\"$ENCODED_PAYLOAD\"}"
              )

              LOGIN_RESP=$(cat "$LOGIN_RESP_FILE")
              rm -f "$LOGIN_RESP_FILE"

              # 解密返回的 Token
              DECODED_LOGIN=$(echo "$LOGIN_RESP" | grep -oP '"data":"\K[^"]+' | base64 -d 2>/dev/null || true)
              AUTH_TOKEN=""

              if [ -n "$DECODED_LOGIN" ]; then
                  AUTH_TOKEN=$(echo "$DECODED_LOGIN" | jq -r '.token // .data.token // empty')
              fi

              if [ -z "$AUTH_TOKEN" ]; then
                  echo "❌ ${ACCOUNT_NAME} 登录失败，未能获取 Token"
                  echo "原始登录响应: $LOGIN_RESP"
                  echo "解密登录响应: $DECODED_LOGIN"
                  LAST_ERROR="登录失败，未返回 Token"
                  FAILED_ACCOUNTS="${FAILED_ACCOUNTS} ${ACCOUNT_NAME}"

                  echo "### ${ACCOUNT_NAME} 登录异常" >> "$LOG_FILE"
                  echo "错误追踪: $LAST_ERROR" >> "$LOG_FILE"
                  echo "HTTP 状态码: $LOGIN_HTTP_CODE" >> "$LOG_FILE"
                  echo "" >> "$LOG_FILE"
                  continue
              fi

              echo "✅ 登录成功！获取到临时 Token: ${AUTH_TOKEN:0:10}..."

              ########################################
              # 阶段 B：使用刚获取的 Token 执行签到
              ########################################
              echo "📝 [2/2] 正在发送签到请求..."

              DYNAMIC_COOKIE="channel_code=WJKCNOCODE; platform=Windows; token=$AUTH_TOKEN"

              CHECKIN_RESP_FILE=$(mktemp)
              CHECKIN_HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --max-time 30 \
                -w "%{http_code}" \
                -o "$CHECKIN_RESP_FILE" \
                -X POST "https://ug.wj-kc.com/api/user/sign_use" \
                -H "cookie: $DYNAMIC_COOKIE" \
                -H "accept: application/json, text/plain, */*" \
                -H "content-type: application/json;charset=UTF-8" \
                -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0" \
                -H "origin: https://3j.wj-kc.com" \
                -H "referer: https://3j.wj-kc.com/user" \
                -d '{}'
              )

              CHECKIN_RESP=$(cat "$CHECKIN_RESP_FILE")
              rm -f "$CHECKIN_RESP_FILE"

              DECODED_CHECKIN=$(echo "$CHECKIN_RESP" | grep -oP '"data":"\K[^"]+' | base64 -d 2>/dev/null || true)

              CODE=""
              MSG=""
              if [ -n "$DECODED_CHECKIN" ]; then
                  CODE=$(echo "$DECODED_CHECKIN" | jq -r '.code // empty')
                  MSG=$(echo "$DECODED_CHECKIN" | jq -r '.msg // empty')

                  echo "CODE : $CODE"
                  echo "MSG  : $MSG"

                  if [[ "$CODE" == "0" && "$MSG" == "SUCCESS" ]] \
                  || [[ "$CODE" == "1028" && "$MSG" == "SIGN_USE_MULTY_TIMES" ]]; then
                      ACCOUNT_SUCCESS=true
                  else
                      LAST_ERROR="签到状态码不符预期（CODE: $CODE, MSG: $MSG）"
                  fi
              else
                  LAST_ERROR="签到响应数据无法解密"
              fi

              if [ "$ACCOUNT_SUCCESS" = true ]; then
                  echo "✅ ${ACCOUNT_NAME} 处理完成（签到成功 / 已签到）"
              else
                  echo "❌ ${ACCOUNT_NAME} 签到失败"
                  FAILED_ACCOUNTS="${FAILED_ACCOUNTS} ${ACCOUNT_NAME}"

                  echo "### ${ACCOUNT_NAME} 签到异常" >> "$LOG_FILE"
                  echo "错误追踪: $LAST_ERROR" >> "$LOG_FILE"
                  echo "HTTP 状态码: $CHECKIN_HTTP_CODE" >> "$LOG_FILE"
                  echo "CODE: $CODE" >> "$LOG_FILE"
                  echo "MSG: $MSG" >> "$LOG_FILE"
                  echo "解码数据: $DECODED_CHECKIN" >> "$LOG_FILE"
                  echo "" >> "$LOG_FILE"
              fi

          done < <(printf "%s\n" "$ACCOUNTS")

          ########################################
          # 4. 汇总结果与触发报警
          ########################################
          if [ -n "$FAILED_ACCOUNTS" ]; then
              echo "has_error=true" >> $GITHUB_OUTPUT
              echo "failed_accounts=$FAILED_ACCOUNTS" >> $GITHUB_OUTPUT

              {
                echo "log_details<<EOF"
                cat "$LOG_FILE"
                echo "EOF"
              } >> $GITHUB_OUTPUT

              echo "⚠️ 以下账号异常：$FAILED_ACCOUNTS"
              exit 1
          else
              echo "has_error=false" >> $GITHUB_OUTPUT
              echo "🎉 所有账号签到成功！"
          fi

      ########################################
      # 5. 邮件提醒
      ########################################
      - name: Send Failure Notification Mail
        if: failure() && steps.checkin_process.outputs.has_error == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ SSPanel 签到异常提醒 - ${{ steps.checkin_process.outputs.failed_accounts }}"
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: "SSPanel 自动签到系统 <${{ secrets.MAIL_USERNAME }}>"
          body: |
            SSPanel 自动签到异常通知

            执行时间：${{ steps.checkin_process.outputs.current_time }}
            失败账号：${{ steps.checkin_process.outputs.failed_accounts }}

            --------------------------------------------------
            排查日志详情：
            ${{ steps.checkin_process.outputs.log_details }}
