name: SSPanel Auto Checkin Direct

on:
  schedule:
    # 北京时间 13:35（UTC 05:35）
    - cron: "35 5 * * *"
    # 北京时间 14:05（UTC 06:05）
    - cron: "5 6 * * *"
    # 北京时间 14:25（UTC 06:25）
    - cron: "25 6 * * *"

  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Execute Checkin
        id: checkin_process
        env:
          TOKENS: ${{ secrets.TOKENS }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
              echo "❌ jq 未安装"
              exit 1
          fi

          if [ -z "$TOKENS" ]; then
              echo "❌ 未检测到 TOKENS 配置"
              exit 1
          fi

          EXEC_TIME=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
          echo "current_time=$EXEC_TIME" >> $GITHUB_OUTPUT
          echo "北京时间启动：$EXEC_TIME"

          # 短随机延迟（手动触发时不等待）
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              RANDOM_DELAY=$(( RANDOM % 301 ))
              echo "随机等待：${RANDOM_DELAY} 秒..."
              sleep "$RANDOM_DELAY"
          fi

          FAILED_ACCOUNTS=""
          TOTAL_COUNT=0
          LOG_FILE="failed_details.log"
          > "$LOG_FILE"

          while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              line=$(echo "$line" | tr -d '\r')

              if [[ "$line" == *"####"* ]]; then
                  ACCOUNT_NAME=$(echo "$line" | awk -F '####' '{print $1}')
                  AUTH_TOKEN=$(echo "$line" | awk -F '####' '{print $2}')
              else
                  ACCOUNT_NAME="默认账号"
                  AUTH_TOKEN="$line"
              fi

              TOTAL_COUNT=$((TOTAL_COUNT+1))

              if [ $TOTAL_COUNT -gt 1 ]; then
                  INTERVAL=$(( 60 + RANDOM % 121 ))
                  echo "--------------------------------------"
                  echo "⏳ 处理下一个账号，等待 ${INTERVAL} 秒..."
                  sleep "$INTERVAL"
              fi

              echo "--------------------------------------"
              echo "🚀 开始处理 ${ACCOUNT_NAME}..."
              echo "🔑 使用 Token: ${AUTH_TOKEN:0:12}..."

              DYNAMIC_COOKIE="channel_code=WJKCNOCODE; platform=Windows; token=$AUTH_TOKEN"

              CHECKIN_RESP_FILE=$(mktemp)
              CHECKIN_HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --max-time 30 \
                -w "%{http_code}" \
                -o "$CHECKIN_RESP_FILE" \
                -X POST "https://3j.wj-kc.com/api/user/sign_use" \
                -H "cookie: $DYNAMIC_COOKIE" \
                -H "accept: application/json, text/plain, */*" \
                -H "content-type: application/json;charset=UTF-8" \
                -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
                -H "origin: https://3j.wj-kc.com" \
                -H "referer: https://3j.wj-kc.com/user" \
                -d '{}'
              )

              CHECKIN_RESP=$(cat "$CHECKIN_RESP_FILE")
              rm -f "$CHECKIN_RESP_FILE"

              DECODED_CHECKIN=$(echo "$CHECKIN_RESP" | grep -oP '"data":"\K[^"]+' | base64 -d 2>/dev/null || echo "$CHECKIN_RESP")

              CODE=$(echo "$DECODED_CHECKIN" | jq -r '.code // empty')
              MSG=$(echo "$DECODED_CHECKIN" | jq -r '.msg // empty')

              echo "HTTP Code : $CHECKIN_HTTP_CODE"
              echo "响应 Code  : $CODE"
              echo "响应 Msg   : $MSG"

              ACCOUNT_SUCCESS=false
              if [[ "$CODE" == "0" && "$MSG" == "SUCCESS" ]] \
              || [[ "$CODE" == "1028" && "$MSG" == "SIGN_USE_MULTY_TIMES" ]]; then
                  ACCOUNT_SUCCESS=true
                  echo "✅ ${ACCOUNT_NAME} 签到成功 / 今日已签到"
              else
                  echo "❌ ${ACCOUNT_NAME} 签到失败"
                  FAILED_ACCOUNTS="${FAILED_ACCOUNTS} ${ACCOUNT_NAME}"

                  echo "### ${ACCOUNT_NAME} 签到异常" >> "$LOG_FILE"
                  echo "HTTP 状态码: $CHECKIN_HTTP_CODE" >> "$LOG_FILE"
                  echo "CODE: $CODE" >> "$LOG_FILE"
                  echo "MSG: $MSG" >> "$LOG_FILE"
                  echo "返回详情: $DECODED_CHECKIN" >> "$LOG_FILE"
                  echo "" >> "$LOG_FILE"
              fi

          done < <(printf "%s\n" "$TOKENS")

          if [ -n "$FAILED_ACCOUNTS" ]; then
              echo "has_error=true" >> $GITHUB_OUTPUT
              echo "failed_accounts=$FAILED_ACCOUNTS" >> $GITHUB_OUTPUT
              {
                echo "log_details<<EOF"
                cat "$LOG_FILE"
                echo "EOF"
              } >> $GITHUB_OUTPUT
              exit 1
          else
              echo "has_error=false" >> $GITHUB_OUTPUT
              echo "🎉 所有账号处理完成！"
          fi

      - name: Send Failure Notification Mail
        if: failure() && steps.checkin_process.outputs.has_error == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ 签到异常提醒 - ${{ steps.checkin_process.outputs.failed_accounts }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "自动签到系统 <${{ secrets.MAIL_USERNAME }}>"
          body: |
            自动签到异常通知

            执行时间：${{ steps.checkin_process.outputs.current_time }}
            失败账号：${{ steps.checkin_process.outputs.failed_accounts }}

            --------------------------------------------------
            详情：
            ${{ steps.checkin_process.outputs.log_details }}
